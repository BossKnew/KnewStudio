name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include secrets here. Use Private Vulnerability Reporting for security issues.
  - type: input
    id: version
    attributes: { label: Version or commit, placeholder: v0.1.0 or commit SHA }
    validations: { required: true }
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Local Compose, LAN Compose, Host Nginx, Host Caddy, Docker Traefik, Cloudflare, External PostgreSQL or Redis, Other]
    validations: { required: true }
  - type: textarea
    id: description
    attributes: { label: What happened?, description: Include expected and actual behavior. Remove hostnames, IPs, credentials, cookies, and personal data. }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Sanitized logs, render: shell }
