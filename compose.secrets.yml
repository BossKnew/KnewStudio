services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
  redis:
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --appendfsync everysec --maxmemory "$${REDIS_MAXMEMORY:-128mb}" --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/redis_password)"
    environment:
      REDIS_PASSWORD: ""
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping"]
    secrets: [redis_password]
  migrate:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      POSTGRES_PASSWORD: ""
    secrets: [database_url]
  api:
    environment:
      DATABASE_URL: ""
      DATABASE_URL_FILE: /run/secrets/database_url
      POSTGRES_PASSWORD: ""
      REDIS_URL: ""
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_PASSWORD: ""
      PROVIDER_SECRET_KEY: ""
      PROVIDER_SECRET_KEY_FILE: /run/secrets/provider_secret_key
      PROVIDER_SECRET_KEYS: ""
      MFA_SECRET_KEY: ""
      MFA_SECRET_KEY_FILE: /run/secrets/mfa_secret_key
      MFA_SECRET_KEYS: ""
      MFA_SECRET_ACTIVE_KID: ""
      BOOTSTRAP_ADMIN_PASSWORD: ""
      BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
    secrets: [database_url, redis_url, provider_secret_key, mfa_secret_key, bootstrap_admin_password]

secrets:
  postgres_password: { file: "${SECRETS_DIR:-./secrets}/postgres_password" }
  redis_password: { file: "${SECRETS_DIR:-./secrets}/redis_password" }
  database_url: { file: "${SECRETS_DIR:-./secrets}/database_url" }
  redis_url: { file: "${SECRETS_DIR:-./secrets}/redis_url" }
  provider_secret_key: { file: "${SECRETS_DIR:-./secrets}/provider_secret_key" }
  mfa_secret_key: { file: "${SECRETS_DIR:-./secrets}/mfa_secret_key" }
  bootstrap_admin_password: { file: "${SECRETS_DIR:-./secrets}/bootstrap_admin_password" }
